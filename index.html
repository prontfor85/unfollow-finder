<style>
  :root{
    --pink:#03C75A; --pink-dk:#02A24A; --bg:#0E0E12; --card:#17171C;
    --card2:#1F1F26; --line:#2A2A33; --txt:#F3F3F5; --sub:#9A9AA6; --green:#33D17A;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{background:#000; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--txt); display:flex; justify-content:center; word-break:keep-all;}
  .phone{width:100%; max-width:430px; min-height:100vh; background:var(--bg); position:relative; overflow:hidden; display:flex; flex-direction:column;}
  /* topbar replaced by app-header */
  .screen{flex:1; padding:max(22px, env(safe-area-inset-top)) 20px calc(110px + 56px + env(safe-area-inset-bottom)); display:none;}
  .screen.active{display:block; animation:slideIn .28s ease;}
  .screen.slide-back{animation:slideInBack .28s ease;}
  @keyframes slideIn{from{transform:translateX(100%); opacity:.6;} to{transform:translateX(0); opacity:1;}}
  @keyframes slideInBack{from{transform:translateX(-30%); opacity:.6;} to{transform:translateX(0); opacity:1;}}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .screen::-webkit-scrollbar{display:none;}
  h2.title{font-size:25px; font-weight:800; line-height:1.32; margin-bottom:10px;}
  h2.title .hl{color:var(--pink);}
  p.lead{color:var(--sub); font-size:14px; line-height:1.6; margin-bottom:22px;}
  .feat{background:var(--card); border-radius:16px; padding:16px; display:flex; gap:13px; align-items:flex-start; margin-bottom:11px;}
  .feat .ic{width:42px; height:42px; flex:none; border-radius:11px; background:rgba(3,199,90,.16); display:flex; align-items:center; justify-content:center; font-size:19px;}
  .feat b{display:block; font-size:15px; margin-bottom:3px;}
  .feat span{color:var(--sub); font-size:12.5px; line-height:1.45;}
  .step{background:var(--card); border-radius:16px; padding:16px; margin-bottom:11px;}
  .step-img-wrap{margin-top:12px; border-radius:12px; overflow:hidden; width:100%; aspect-ratio:1/1; position:relative; background:var(--card2);}
  .step-img{width:100%; height:100%; object-fit:cover; border-radius:12px; display:block; position:absolute; inset:0;}
  .step-img-ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border:1px dashed var(--line); border-radius:12px; font-size:13px; color:var(--sub);}
  .guide-slide { min-width:100%; flex:0 0 100%; padding:0 20px 20px; box-sizing:border-box; overflow-y:auto; }
  #guide-slides { display:flex; width:100%; }
  .step .tag{display:inline-block; background:rgba(3,199,90,.18); color:var(--pink); font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; margin-bottom:8px;}
  .step b{font-size:15px; display:block; margin-bottom:5px;}
  .step span{color:var(--sub); font-size:13px; line-height:1.55;}
  .step span code{background:var(--card2); padding:1px 6px; border-radius:5px; color:var(--txt); font-size:12px;}
  .note{display:flex; gap:8px; background:rgba(51,209,122,.1); border:1px solid rgba(51,209,122,.3); border-radius:12px; padding:12px 14px; margin:6px 0 16px; font-size:12.5px; color:#bdeccf; line-height:1.5;}
  .note.warn{background:rgba(255,176,32,.1); border-color:rgba(255,176,32,.35); color:#f0d9a6;}
  .drop{border:2px dashed var(--line); border-radius:16px; padding:30px 18px; text-align:center; background:var(--card); cursor:pointer; transition:.15s; margin-bottom:14px;}
  .drop:hover,.drop.over{border-color:var(--pink); background:rgba(3,199,90,.06);}
  .drop .big{font-size:34px; margin-bottom:10px;}
  .drop b{font-size:15px;} .drop span{display:block; color:var(--sub); font-size:12.5px; margin-top:6px; line-height:1.5;}

let currentPrivacyLang = 'ko';
function setPrivacyLang(lang) {
  currentPrivacyLang = lang;
  var content = document.getElementById('privacy-content');
  if(content) content.innerHTML = PRIVACY[lang] || PRIVACY['en'];
  ['ko','en','ja','es'].forEach(function(l) {
    var btn = document.getElementById('ptab-'+l);
    if(!btn) return;
    if(l === lang) {
      btn.style.background = 'var(--pink)';
      btn.style.borderColor = 'var(--pink)';
      btn.style.color = '#fff';
    } else {
      btn.style.background = 'transparent';
      btn.style.borderColor = 'var(--line)';
      btn.style.color = 'var(--sub)';
    }
  });
}

/* premium helpers */
function isPremium(){ return localStorage.getItem('iuf_premium') === 'true'; }
function setPremium(){ localStorage.setItem('iuf_premium', 'true'); }

function purchasePremium(){
  setPremium();
  applyLang();
  hidePaywall();
  if(state.result) renderList();
  toast(T[window.lang].toast_premium || '프리미엄이 활성화됐어요! 🎉');
}

function restorePurchase(){
  const L = T[window.lang];
  if(isPremium()){
    toast(L.toast_already_premium || 'Already premium!');
  } else {
    toast(L.toast_no_purchase || 'No purchases to restore.');
  }
}

/* ---- language init ---- */
(function(){
  const saved = localStorage.getItem('iuf_lang');
  if(['ko','en','ja','es'].includes(saved)){ window.lang = saved; }
  else {
    const nav = navigator.language.toLowerCase();
    if(nav.startsWith('ko')) window.lang = 'ko';
    else if(nav.startsWith('ja')) window.lang = 'ja';
    else if(nav.startsWith('es')) window.lang = 'es';
    else window.lang = 'en';
  }
})();

let obStep = 0;

function showOnboarding() {
  const overlay = document.getElementById('onboarding-overlay');
  if(overlay) { overlay.style.display = 'flex'; applyOnboardingLang(); }
}

function finishOnboarding() {
  localStorage.setItem('iuf_onboarded', 'true');
  const overlay = document.getElementById('onboarding-overlay');
  if(overlay) overlay.style.display = 'none';
}
function replayOnboarding() {
  localStorage.removeItem('iuf_onboarded');
  obStep = 0;
  showOnboarding();
}

function obNext() {
  if(obStep < 2) {
    obStep++;
    const slides = document.getElementById('ob-slides');
    if(slides) slides.scrollLeft = obStep * slides.offsetWidth;
    updateObDots();
    applyOnboardingLang();
  } else {
    finishOnboarding();
  }
}

function updateObDots() {
  [0,1,2].forEach(i => {
    const dot = document.getElementById('ob-dot-'+i);
    if(!dot) return;
    dot.style.width = i === obStep ? '20px' : '6px';
    dot.style.background = i === obStep ? 'var(--pink)' : 'var(--line)';
  });
}

function applyOnboardingLang() {
  const L = T[window.lang];
  const skip = document.getElementById('ob-skip'); if(skip) skip.textContent = L.ob_skip;
  const btn = document.getElementById('ob-btn'); if(btn) btn.textContent = obStep < 2 ? L.ob_next : L.ob_start;
  ['t1','t2','t3'].forEach((k) => {
    const el = document.getElementById('ob-'+k);
    if(el) el.innerHTML = (L['ob_'+k]||'').replace(/\n/g,'<br>');
  });
  ['d1','d2','d3'].forEach((k) => {
    const el = document.getElementById('ob-'+k);
    if(el) el.innerHTML = (L['ob_'+k]||'').replace(/\n/g,'<br>');
  });
}

function go(name, isBack){
  const prev = screenStack[screenStack.length-1];

    screenStack.pop();

    if(prev !== name) screenStack.push(name);
  }
  screens.forEach(s => {

    }
  });
  // 탭바 활성 탭 업데이트
  const homeScreens = ['onboard','guide','upload','analyze','result'];
  const isHomeTab = homeScreens.includes(name);

  const tabHist = document.getElementById('tab-history');
  if(tabHome){ tabHome.classList.toggle('active', isHomeTab); }
  if(tabHist){ tabHist.classList.toggle('active', name==='history'); }
  if(name==='guide'){ guideStep=0; setTimeout(guideUpdateView, 50); }

/* ---------- Instagram export parsing (robust to versions) ---------- */
// Normalize any value to a bare username. Some files store the clean username in
// `value`, others ONLY store a full profile URL in `href` (e.g. following.json).
function cleanUser(s){
  if(!s) return '';
  s = String(s).trim();
  // Instagram export hrefs look like instagram.com/_u/<username> ; also handle plain URLs
  let m = s.match(/instagram\.com\/_u\/([^/?#\s]+)/i) || s.match(/instagram\.com\/([^/?#\s]+)/i);
  if(m) s = m[1];
  return s.replace(/^@/,'').replace(/\/+$/,'').trim();
}
function extractUsernames(json){
  // Handle: top-level array, or object with relationships_* / connections keys
  let arr = null;
  if(Array.isArray(json)) arr = json;
  else if(json && typeof json==='object'){
    for(const k of Object.keys(json)){
      if(Array.isArray(json[k])){ arr = json[k]; break; }
    }
  }
  if(!arr) return [];
  const out = [];
  for(const item of arr){
    let sld = item && item.string_list_data;
    if(Array.isArray(sld) && sld.length){
      // prefer clean value, then title (clean username), then URL in href
      const raw = sld[0].value || item.title || sld[0].href || '';
      const u = cleanUser(raw);
      const ts = Number(sld[0].timestamp) || null; // unix seconds: when the follow happened
      if(u) out.push({u, ts});
    } else if(typeof item==='string'){
      const u = cleanUser(item); if(u) out.push({u, ts:null});
    }
  }
  return out;
}

// Parse usernames from Instagram HTML export (anchors to instagram.com/<user>)
function parseHtmlUsernames(html){
  const out = [];
  let doc;
  try { doc = new DOMParser().parseFromString(html, 'text/html'); }
  catch(e){ doc = null; }
  if(doc){
    doc.querySelectorAll('a[href]').forEach(a=>{
      const href = a.getAttribute('href') || '';
      const u = cleanUser(href);
      if(u && u.toLowerCase()!=='p' && u.toLowerCase()!=='explore' && u.toLowerCase()!=='_u'){ out.push({u, ts:null}); }
    });
  }
  if(!out.length){ // fallback: regex over raw text
    let m; const re=/instagram\.com\/(?:_u\/)?([A-Za-z0-9._]+)/gi;
    while((m=re.exec(html))){ const u=cleanUser(m[0]); if(u && u!=='_u') out.push({u, ts:null}); }
  }
  return out;
}

// Decide parser by file extension
function extractFromContent(base, content){
  if(base.endsWith('.json')){ try{ return extractUsernames(JSON.parse(content)); }catch(e){ return []; } }
  if(base.endsWith('.html') || base.endsWith('.htm')){ return parseHtmlUsernames(content); }
  return [];
}

async function readDataFile(file){
  const txt = await file.text();
  const base = file.name.toLowerCase();
  if(base.endsWith('.json')){ try{ return extractUsernames(JSON.parse(txt)); }catch(e){ throw new Error(T[window.lang].json_error+': '+file.name); } }
  return parseHtmlUsernames(txt);
}

async function handleZip(file){
  const loading = (m)=> $('#zipStatus').innerHTML = '<div class="note"><span>⏳</span><div>'+m+'</div></div>';
  loading(T[window.lang].zip_extracting);
  try{
    const zip = await JSZip.loadAsync(file);
    loading(T[window.lang].zip_analyzing);
    await new Promise(r=>setTimeout(r,0));
    let followers = [], following = [];
    const allFiles = [];
    for(const path of Object.keys(zip.files)){
      if(zip.files[path].dir) continue;
      allFiles.push(path);
      const lower = path.toLowerCase();
      const base = path.split('/').pop().toLowerCase(); // classify by filename, not folder
      const isData = lower.endsWith('.json') || lower.endsWith('.html') || lower.endsWith('.htm');
      if(!isData || !base.includes('follow')) continue;
      const content = await zip.files[path].async('string');
      const users = extractFromContent(base, content);
      if(base.includes('following')){ following = following.concat(users); }
      else if(base.includes('follower')){ followers = followers.concat(users); }
    }
    if(!followers.length && !following.length){
      const followish = allFiles.filter(p=>p.toLowerCase().includes('follow'));
      const show = (followish.length ? followish : allFiles).slice(0,40);
      const list = show.map(p=>'· '+escapeHtml(p)).join('<br>') || T[window.lang].zip_empty;
      throw new Error(T[window.lang].zip_not_found+'<br><br><div style="font-size:11px;color:#cfcfd6;max-height:170px;overflow:auto;text-align:left">'+list+'</div>');
    }
    setFollowers(followers);
    setFollowing(following);
    const detected = accountFromZipName(file.name);
    state.account = detected || null;
    state.exportDate = dateFromZipName(file.name);
    $('#zipStatus').innerHTML = '<div class="note"><span>✅</span><div><b>'+escapeHtml(file.name)+'</b> '+T[window.lang].zip_ok+' — '+T[window.lang].followers+' '+state.followers.length+T[window.lang].count+' · '+T[window.lang].following+' '+state.following.length+T[window.lang].count+(detected?' · '+T[window.lang].account+' @'+escapeHtml(detected):'')+'</div></div>';
    renderButton('upload');
  }catch(err){
    $('#zipStatus').innerHTML = '<div class="note warn"><span>⚠️</span><div>'+err.message+'</div></div>';
  }
}

function dedupe(a){ return Array.from(new Set(a.filter(Boolean))); }

/* ---------- account identity (2+ accounts support) ---------- */
function normAcct(s){ return (s||'').trim().toLowerCase().replace(/^@/,'').replace(/\s+/g,''); }
function accountFromZipName(name){ const m=(name||'').toLowerCase().match(/instagram-([a-z0-9._]+)-\d/); return m?m[1]:''; }
function currentAccount(){ return normAcct(state.account||''); }
function acctLabel(a){ return a ? '@'+a : T[window.lang].unknown_account; }

/* ---------- visited profiles (방문함 / 최근 방문) — device only ---------- */
function getVisited(){ try{ const v=localStorage.getItem('iuf_visited'); if(v!=null) return JSON.parse(v); }catch(e){} return {}; }
function setVisited(o){ try{ localStorage.setItem('iuf_visited', JSON.stringify(o)); }catch(e){} }
function markVisited(u){ const o=getVisited(); o[u]=Date.now(); setVisited(o); }
function mostRecentVisited(){ const o=getVisited(); let best=null,bt=0; for(const k in o){ if(o[k]>bt){ bt=o[k]; best=k; } } return best; }

/* ---------- export date from filename (auto-order comparisons) ---------- */
function dateFromZipName(name){ const m=(name||'').toLowerCase().match(/instagram-[a-z0-9._]+-(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; const t=new Date(+m[1], +m[2]-1, +m[3]).getTime(); return isNaN(t)?null:t; }
function effDate(s){ return (s && (s.exportDate || s.date)) || 0; } // 내보내기 날짜 우선, 없으면 분석 시각

// entries: [{u, ts}] -> dedup by username, keep first non-null timestamp
function buildMap(entries){
  const m = new Map();
  for(const e of entries){ if(!e || !e.u) continue; if(!m.has(e.u) || (e.ts && !m.get(e.u))) m.set(e.u, e.ts || null); }
  return m;
}
function setFollowers(entries){ state.tsFollower = buildMap(entries); state.followers = [...state.tsFollower.keys()]; }
function setFollowing(entries){ state.tsFollowing = buildMap(entries); state.following = [...state.tsFollowing.keys()]; }


/* ---------- analyze ---------- */
function runAnalyze(){
  go('analyze');
  $('#analyzeMeta').textContent = T[window.lang].followers+' '+state.followers.length+T[window.lang].count+' · '+T[window.lang].following+' '+state.following.length+T[window.lang].count;
  setTimeout(()=>{
    const F = new Set(state.followers);   // people who follow me
    const G = new Set(state.following);   // people I follow
    const mutual = state.following.filter(u=>F.has(u));
    const iDontFollow = state.followers.filter(u=>!G.has(u));   // they follow me, I don't
    const notFollowMe = state.following.filter(u=>!F.has(u));   // I follow, they don't follow back
    state.result = { mutual:dedupe(mutual), iDontFollow:dedupe(iDontFollow), notFollowMe:dedupe(notFollowMe) };
    saveSnapshot();
    showResult();
    // 자동 비교 안 함 — 결과 화면의 "지난 기록과 비교하기" 버튼으로만 비교
  }, 1100);
}

/* ---------- history (saved on this device only) ---------- */
let memHistory = [];
function getHistory(){ try{ const v=localStorage.getItem('iuf_history'); if(v!=null) return JSON.parse(v); }catch(e){} return memHistory; }
function setHistory(h){ try{ localStorage.setItem('iuf_history', JSON.stringify(h.slice(0,30))); }catch(e){ memHistory = h.slice(0,30); } }
function saveSnapshot(){
  const snap = { date: Date.now(), exportDate: state.exportDate || null, account: currentAccount() || null,
                 listFollowers: state.followers.slice(), listFollowing: state.following.slice(),
                 tsFollower: Object.fromEntries(state.tsFollower), tsFollowing: Object.fromEntries(state.tsFollowing) };
  const h = getHistory(); h.unshift(snap); setHistory(h);
}
// 저장된 스냅샷을 분석 결과(풀페이지)로 다시 보여주기
function viewSnapshot(i){
  const h = getHistory(); const s = h[i]; if(!s) return;
  state.followers = (s.listFollowers||[]).slice();
  state.following = (s.listFollowing||[]).slice();
  state.tsFollower = new Map(Object.entries(s.tsFollower||{}));
  state.tsFollowing = new Map(Object.entries(s.tsFollowing||{}));
  const F = new Set(state.followers), G = new Set(state.following);
  state.result = {
    mutual: dedupe(state.following.filter(u=>F.has(u))),
    iDontFollow: dedupe(state.followers.filter(u=>!G.has(u))),
    notFollowMe: dedupe(state.following.filter(u=>!F.has(u)))
  };
  showResult();
}
function fmtDate(ts){ const d=new Date(ts); if(window.lang==='en') return (d.getMonth()+1)+'/'+d.getDate(); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function fmtDateTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); if(window.lang==='en') return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()); return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()); }
// derive stats from a saved snapshot's stored lists
function snapStats(s){
  const F=new Set(s.listFollowers||[]);
  const following=(s.listFollowing||[]).length, followers=(s.listFollowers||[]).length;
  const mutual=(s.listFollowing||[]).filter(u=>F.has(u)).length;
  return { following, followers, mutual, unfollow: following-mutual, fans: followers-mutual };
}

  state.tab='notme'; state.sort='rec'; state.editMode=false; state.removed=new Set(); state.shown=50;
  $('#editToggle').textContent=T[window.lang].btn_edit; $('#editToggle').classList.remove('done');
  $('#sortBtn').textContent=T[window.lang].sort_rec+' ▾';
  $('#sortMenu').querySelectorAll('[data-sort]').forEach(x=>{ x.textContent=T[window.lang]['sort_'+x.dataset.sort]; x.classList.toggle('active', x.dataset.sort==='rec'); });
  $('#search').value='';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='notme'));
  renderList();
  go('result');
}

// base array for a tab (before search / removed / sort)
function baseArray(tab){
  const r = state.result;
  return tab==='mutual'? r.mutual : tab==='notthem'? r.iDontFollow : r.notFollowMe;
}
// timestamp for a user, depending on which tab we're viewing
function tsForUser(u, tab){
  return (tab==='notthem') ? state.tsFollower.get(u) : state.tsFollowing.get(u);
}
function daysFor(u, tab){
  const ts = tsForUser(u, tab);
  if(!ts) return null;
  const d = Math.floor((Date.now()/1000 - ts) / 86400);
  return d>=0 ? d : null;
}
function catCount(tab){ return baseArray(tab).filter(u=>!state.removed.has(u)).length; }

function updateCounts(){
  $('#cNotMe').textContent = catCount('notme');
  $('#cMutual').textContent = catCount('mutual');
  $('#cNotThem').textContent = catCount('notthem');
  const labels = {notme:T[window.lang].tab_notme_full, mutual:T[window.lang].tab_mutual_full, notthem:T[window.lang].tab_notthem_full};
  if($('#heroLbl')) $('#heroLbl').textContent = labels[state.tab];
  const n = catCount(state.tab);
  $('#rNotFollowMe').innerHTML = n+'<small>'+T[window.lang].count+'</small>';
  if(state.tab==='notthem'){ const t=state.followers.length||1; $('#rNotFollowMeSub').textContent=T[window.lang].of_total_followers.replace('{n}',state.followers.length).replace('{p}',Math.round(n/t*1000)/10); }
  else { const t=state.following.length||1; $('#rNotFollowMeSub').textContent=T[window.lang].of_total_following.replace('{n}',state.following.length).replace('{p}',Math.round(n/t*1000)/10); }
}

function currentList(){
  const q = $('#search').value.trim().toLowerCase();
  let arr = baseArray(state.tab).filter(u=>!state.removed.has(u));
  if(q) arr = arr.filter(u=>u.toLowerCase().includes(q));
  if(state.sort!=='rec'){
    arr = arr.slice().sort((a,b)=>{
      const va = tsForUser(a, state.tab) || 0, vb = tsForUser(b, state.tab) || 0;
      return state.sort==='new' ? vb-va : va-vb; // 최신순=내림차, 오래된순=오름차
    });
  }
  return arr;
}

function renderList(){
  updateCounts();
  const all = currentList();
  const box = $('#list');
  const lab = state.tab==='mutual' ? T[window.lang].tab_mutual_full : T[window.lang].following_label;
  if(!all.length){ box.innerHTML = '<div class="empty">'+T[window.lang].empty_list+'</div>'; return; }
  const premium = isPremium();
  const freeLimit = 10;
  const shown = Math.min(state.shown, premium ? all.length : Math.min(all.length, freeLimit));
  const arr = all.slice(0, shown);
  const visited = getVisited();
  const recent = mostRecentVisited();
  let html = arr.map(u=>{
    const d = daysFor(u, state.tab);
    const sub = (d!=null) ? (d+T[window.lang].days_label+lab) : ('instagram.com/'+escapeHtml(u));
    if(state.editMode){
      return `<div class="row-u"><div class="av"></div><div class="nm"><b>@${escapeHtml(u)}</b><span>${sub}</span></div><button class="del" data-u="${escapeHtml(u)}">삭제</button></div>`;
    }
    const badge = (u===recent) ? '<span class="visit recent">'+T[window.lang].visited_recent+'</span>'
                : (visited[u]) ? '<span class="visit">'+T[window.lang].visited+'</span>' : '';
    return `<a class="row-u" data-u="${escapeHtml(u)}" href="https://instagram.com/${encodeURIComponent(u)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;"><div class="av"></div><div class="nm"><b>@${escapeHtml(u)}</b><span>${sub}</span></div>${badge}<span class="chev" style="color:var(--sub);font-size:18px;margin-left:8px;">›</span></a>`;
  }).join('');
  if(premium && all.length > shown){ html += '<button class="moreBtn" id="moreBtn">'+T[window.lang].load_more.replace('{n}',all.length-shown)+'</button>'; }
  if(!premium && all.length > freeLimit){
    html += '<div style="filter:blur(4px);pointer-events:none;opacity:0.6;">';
    const blurItems = all.slice(freeLimit, freeLimit+3);
    blurItems.forEach(u=>{
      html += `<div class="row-u"><div class="av"></div><div class="nm"><b>@${escapeHtml(u)}</b><span>instagram.com/${escapeHtml(u)}</span></div></div>`;
    });
    html += '</div>';
    const unlockLabel = (T[window.lang].btn_unlock_full) || 'Unlock Full List';
    html += `<div style="text-align:center;margin-top:-60px;position:relative;z-index:2;padding-bottom:20px;"><button onclick="showPaywall()" style="background:var(--pink);color:#fff;border:none;border-radius:13px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;" id="unlock-btn">${unlockLabel}</button></div>`;
  }
  box.innerHTML = html;
  if(state.editMode){
    box.querySelectorAll('.del').forEach(btn=> btn.onclick=()=>{ state.removed.add(btn.dataset.u); renderList(); });
  } else {
    box.querySelectorAll('.row-u[data-u]').forEach(a=> a.addEventListener('click', ()=>{ markVisited(a.dataset.u); setTimeout(renderList, 60); }));
  }
  const more = box.querySelector('#moreBtn');
  if(more) more.onclick = ()=>{ state.shown += 50; renderList(); };
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function resetAll(){
  state.followers=null; state.following=null; state.result=null;
  state.tsFollower=new Map(); state.tsFollowing=new Map();
  state.editMode=false; state.sort='rec'; state.removed=new Set(); state.compareMode=false; state.exportDate=null;
  $('#zipStatus').innerHTML=''; $('#search').value=''; state.account=null;
  go('upload');
}

/* ---------- modal / share / contact / compare ---------- */
function openModal(html){ $('#sheet').innerHTML = html; $('#overlay').classList.remove('hidden'); }
function closeModal(){ $('#overlay').classList.add('hidden'); }
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'),1800); }

function goHome(){ closeModal(); resetAll(); go('onboard'); }

async function shareApp(){
  const url = location.href;
  const data = { title:T[window.lang].share_title, text:T[window.lang].share_text, url };
  if(navigator.share){ try{ await navigator.share(data); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); toast(T[window.lang].toast_link_copied); }
  catch(e){ openModal('<h3>'+T[window.lang].share_modal_title+'</h3><div class="sd">'+T[window.lang].share_modal_desc+'</div><div class="copyrow"><input id="shareUrl" readonly value="'+escapeHtml(url)+'"><button onclick="copyField(\'shareUrl\')">'+T[window.lang].btn_copy+'</button></div><button class="close" onclick="closeModal()">닫기</button>'); }
}
function copyField(id){ const el=$('#'+id); el.select(); try{ navigator.clipboard.writeText(el.value); }catch(e){ document.execCommand('copy'); } toast(T[window.lang].toast_copied); }

function openContact(){
  openModal('<h3>'+T[window.lang].contact_title+'</h3><div class="sd">'+T[window.lang].contact_desc+'</div>'+
    '<div class="copyrow"><input id="contactMail" readonly value="prontfor.studio@gmail.com"><button onclick="copyField(\'contactMail\')">'+T[window.lang].btn_copy+'</button></div>'+
    '<div class="sd" style="margin-bottom:8px">'+T[window.lang].contact_note+'</div>'+
    '<button class="close" onclick="closeModal()">'+T[window.lang].btn_close+'</button>');
}

function openCompareList(){
  const h = getHistory();
  const acct = h[0] ? (h[0].account||null) : null;
  const past = h.map((s,i)=>({s,i})).filter(x => x.i>0 && (x.s.account||null)===acct);
  let body;
  if(!past.length){
    body = '<div class="sd" style="margin-top:12px;">'+(acct?'@'+escapeHtml(acct)+' ':'')+(T[window.lang].compare_no_past)+'</div>';
  } else {
    body = past.map(x=>{ const st=snapStats(x.s); return '<div class="rec" onclick="compareWith('+x.i+",'list')\"><b>"+fmtDate(x.s.date)+'</b><span>팔로워 '+st.followers+'명 · 언팔 '+st.unfollow+'명</span></div>'; }).join('');
  }
  const hdr = document.getElementById('compare-hdr-title');
  if(hdr) hdr.textContent = T[window.lang].compare_title||'비교할 기록 선택';
  const content = document.getElementById('compare-content');
  if(content) content.innerHTML = '<div class="sd" style="margin-bottom:16px;">'+(acct?escapeHtml(acctLabel(acct))+' · ':'')+T[window.lang].compare_desc+'</div>'+body;
  go('compare');
}

// 같은 계정 기록끼리, 내보내기 날짜(없으면 분석 시각) 기준으로 older→newer를 자동 정렬해 비교.
function compareWith(idx, from){
  const h = getHistory(); const picked = h[idx]; if(!picked) return;
  const acct = picked.account||null;
  const visited = getVisited(); const recent = mostRecentVisited();
  const vbadge = (u)=> (u===recent) ? '<span class="visit recent">최근 방문</span>' : (visited[u] ? '<span class="visit">방문함</span>' : '');
  const row = (u, sub) => '<a class="row-u" data-u="'+escapeHtml(u)+'" href="https://instagram.com/'+encodeURIComponent(u)+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;"><div class="av"></div><div class="nm"><b>@'+escapeHtml(u)+'</b><span>'+sub+'</span></div>'+vbadge(u)+'<span class="chev" style="color:var(--sub);font-size:18px;margin-left:8px;">›</span></a>';
  const head = (color,text) => '<div style="display:flex;align-items:center;gap:7px;margin:18px 0 8px;"><span style="width:8px;height:8px;border-radius:50%;background:'+color+';"></span><span style="font-size:13px;font-weight:700;color:'+color+';">'+text+'</span></div>';
  const listOf = (arr,sub) => arr.length ? arr.slice(0,80).map(u=>row(u,sub)).join('') : '<div class="empty">없어요</div>';

  const showComparePage = (html, title) => {
    const hdr = document.getElementById('compare-hdr-title');
    if(hdr) hdr.textContent = title;
    const content = document.getElementById('compare-content');
    if(content) content.innerHTML = html;
    go('compare');
    document.querySelectorAll('#cmpLost a.row-u, #cmpNew a.row-u').forEach(a=> a.addEventListener('click', ()=>{ markVisited(a.getAttribute('data-u')); setTimeout(refreshCmpVisited, 60); }));
  };

  // 같은 계정 기록을 날짜 내림차순 정렬해 older/newer 결정
  const same = h.map((s,i)=>({s,i})).filter(x=>(x.s.account||null)===acct).sort((a,b)=>effDate(b.s)-effDate(a.s));
  let older=null, newer=null;
  if(same.length>=2){
    if(same[0].i===idx){ older=same[1].s; newer=picked; }
    else { older=picked; newer=same[0].s; }
  }

  if(!older || !newer){
    const st = snapStats(picked);
    showComparePage(
      (acct?'<div class="sd" style="margin-bottom:16px;">'+escapeHtml(acctLabel(acct))+'</div>':'')+
      '<div class="cmpbox"><div class="c"><b>'+st.mutual+'</b><span>'+T[window.lang].tab_mutual_full+'</span></div><div class="c minus"><b>'+st.unfollow+'</b><span>'+T[window.lang].unfollow+'</span></div><div class="c plus"><b>'+st.fans+'</b><span>'+T[window.lang].fans+'</span></div></div>'+
      '<div class="sd" style="margin-top:16px;">'+T[window.lang].compare_no_other+'</div>',
      fmtDate(effDate(picked))
    );
    return;
  }

  const newerF = new Set(newer.listFollowers||[]);
  const olderF = new Set(older.listFollowers||[]);
  const lost = (older.listFollowers||[]).filter(u=>!newerF.has(u));
  const gained = (newer.listFollowers||[]).filter(u=>!olderF.has(u));
  const dft = lost.length>0 ? 'lost' : 'new';
  const title = fmtDate(effDate(older))+' '+(T[window.lang].compare_vs||'대비 변화');
  showComparePage(
    '<div class="sd" style="margin-bottom:16px;">'+(acct?escapeHtml(acctLabel(acct))+' · ':'')+fmtDate(effDate(older))+' → '+fmtDate(effDate(newer))+'</div>'+
    '<div class="cmpbox">'+
      '<div class="c minus'+(dft==='lost'?' on':'')+'" id="cmpTabLost" onclick="cmpTab(\'lost\')"><b>'+lost.length+'</b><span>나를 언팔함</span></div>'+
      '<div class="c plus'+(dft==='new'?' on':'')+'" id="cmpTabNew" onclick="cmpTab(\'new\')"><b>'+gained.length+'</b><span>새 팔로워</span></div>'+
    '</div>'+
    '<div id="cmpLost" style="display:'+(dft==='lost'?'block':'none')+'">'+head('#FF5C5C','나를 언팔한 사람')+listOf(lost,'이전엔 나를 팔로우했어요')+'</div>'+
    '<div id="cmpNew" style="display:'+(dft==='new'?'block':'none')+'">'+head('var(--green)','새로 생긴 팔로워')+listOf(gained,'새로 나를 팔로우했어요')+'</div>',
    title
  );
}
// 비교 목록의 방문함/최근 방문 뱃지를 즉석 갱신 (탭/스크롤 유지)
function refreshCmpVisited(){
  const visited=getVisited(), recent=mostRecentVisited();
  document.querySelectorAll('#cmpLost a.row-u, #cmpNew a.row-u').forEach(a=>{
    const u=a.getAttribute('data-u'); if(!u) return;
    let b=a.querySelector('.visit');
    const need = (u===recent)?'recent':(visited[u]?'on':null);
    if(!need){ if(b) b.remove(); return; }
    if(!b){ b=document.createElement('span'); a.insertBefore(b, a.querySelector('.chev')); }
    b.className = 'visit'+(need==='recent'?' recent':'');
    b.textContent = (need==='recent') ? T[window.lang].visited_recent : T[window.lang].visited;
  });
}
function cmpTab(which){
  const L=document.getElementById('cmpLost'), N=document.getElementById('cmpNew');
  const tL=document.getElementById('cmpTabLost'), tN=document.getElementById('cmpTabNew');
  if(!L||!N) return;
  L.style.display = which==='lost'?'block':'none';
  N.style.display = which==='new'?'block':'none';
  if(tL) tL.classList.toggle('on', which==='lost');
  if(tN) tN.classList.toggle('on', which==='new');
}

/* ---------- wire up ---------- */
// homeLogo removed
const goHomeEl = $('#goHome'); if(goHomeEl) goHomeEl.onclick = goHome;
const shareAppEl = $('#shareApp'); if(shareAppEl) shareAppEl.onclick = shareApp;
const contactEl = $('#contact'); if(contactEl) contactEl.onclick = openContact;
$('#compareBtn').onclick = ()=>{ if(!isPremium()){ showPaywall(); return; } openCompareList(); };
const goHome2El = $('#goHome2'); if(goHome2El) goHome2El.onclick = ()=>{ closeModal(); go('onboard'); };
$('#overlay').onclick = e=>{ if(e.target.id==='overlay') closeModal(); };

$('#dropZip').onclick = ()=> $('#fileZip').click();
$('#fileZip').onchange = e=>{ if(e.target.files[0]) handleZip(e.target.files[0]); };
['dragover','dragenter'].forEach(ev=>$('#dropZip').addEventListener(ev,e=>{e.preventDefault();$('#dropZip').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('#dropZip').addEventListener(ev,e=>{e.preventDefault();$('#dropZip').classList.remove('over');}));
$('#dropZip').addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) handleZip(f); });

document.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>{
  state.tab = t.dataset.tab; state.shown=50;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x===t));
  renderList();
});
$('#search').oninput = ()=>{ state.shown=50; renderList(); };

// edit mode (편집 ↔ 완료) — shows 삭제 buttons
$('#editToggle').onclick = ()=>{
  state.editMode = !state.editMode;
  $('#editToggle').textContent = state.editMode ? T[window.lang].btn_done : T[window.lang].btn_edit;
  $('#editToggle').classList.toggle('done', state.editMode);
  renderList();
};
// sort dropdown (추천순 / 최신순 / 오래된순)
$('#sortBtn').onclick = e=>{ e.stopPropagation(); $('#sortMenu').classList.toggle('hidden'); };
$('#sortMenu').querySelectorAll('[data-sort]').forEach(it=> it.onclick = ()=>{
  state.sort = it.dataset.sort; state.shown=50;
  $('#sortBtn').textContent = T[window.lang]['sort_'+state.sort] + ' ▾';
  $('#sortMenu').querySelectorAll('[data-sort]').forEach(x=>{ x.textContent=T[window.lang]['sort_'+x.dataset.sort]; x.classList.toggle('active', x===it); });
  $('#sortMenu').classList.add('hidden');
  renderList();
});
document.addEventListener('click', ()=> $('#sortMenu').classList.add('hidden'));

$('#histExport').onclick = exportHistory;
$('#histImport').onclick = ()=> $('#histFile').click();
$('#histClear').onclick = clearAllHistory;
$('#histFile').onchange = e=>{ if(e.target.files[0]) importHistory(e.target.files[0]); };

applyLang();
screenStack.push('onboard');
go('onboard');

// 첫 실행 시 온보딩 표시
if(!localStorage.getItem('iuf_onboarded')) {
  obStep = 0;
  showOnboarding();
}

if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
